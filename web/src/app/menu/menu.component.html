<ion-menu contentId="main-content" type="overlay">
  <ion-header>
    <ion-toolbar class="menu-toolbar">
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-menu-toggle auto-hide="true">
        <ion-item button routerLink="/home" routerDirection="root">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle *ngIf="isAuthenticated()" auto-hide="true">
        <ion-item button routerLink="/person" routerDirection="forward">
          <ion-icon slot="start" name="people-outline"></ion-icon>
          <ion-label>Personen</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle *ngIf="isAdmin()" auto-hide="true">
        <ion-item button routerLink="/athletes" routerDirection="forward">
          <ion-icon slot="start" name="barbell-outline"></ion-icon>
          <ion-label>Athleten</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle *ngIf="!isAuthenticated()" auto-hide="true">
        <ion-item button routerLink="/person" routerDirection="forward">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          <ion-label>Login</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>

    <ion-list *ngIf="isAuthenticated()">
      <ion-item>
        <ion-icon slot="start" name="person-circle-outline"></ion-icon>
        <ion-label>{{ user?.userDetails }}</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
        <ion-label>{{ user?.userRoles }}</ion-label>
      </ion-item>
      <ion-item button href="/.auth/logout">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        <ion-label>Logoff</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="app-shell ion-page" id="main-content">
  <ion-header>
    <ion-toolbar color="primary" class="top-toolbar">
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title class="brand-title">Template</ion-title>
      <ion-buttons slot="end" class="desktop-menu">
        <ion-button routerLink="/home">Home</ion-button>
        <ion-button *ngIf="isAuthenticated()" routerLink="/person">Personen</ion-button>
        <ion-button *ngIf="isAdmin()" routerLink="/athletes">Athleten</ion-button>
        <ion-button *ngIf="!isAuthenticated()" routerLink="/person">Login</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content [fullscreen]="true" class="main-content">
    <ng-content></ng-content>
  </ion-content>
</div>
