<section class="person-page">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Personen</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Naam</ion-label>
        <ion-input
          placeholder="naam"
          [(ngModel)]="inputValue"
          [ngModelOptions]="{standalone: true}">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Email (optioneel)</ion-label>
        <ion-input
          placeholder="email"
          type="email"
          [(ngModel)]="emailValue"
          [ngModelOptions]="{standalone: true}">
        </ion-input>
      </ion-item>

      <ion-button expand="block" class="save-button" (click)="getProfile()">Save person</ion-button>
      <ion-note *ngIf="message" color="success" class="message">{{ message }}</ion-note>
      <ion-note *ngIf="errorMessage" color="danger" class="message">{{ errorMessage }}</ion-note>
    </ion-card-content>
  </ion-card>

  <ion-item>
    <ion-label position="stacked">Filter</ion-label>
    <ion-searchbar
      [value]="filterValue"
      (ionInput)="onFilterChange($any($event.target).value ?? '')"
      placeholder="Filter op id, email of naam">
    </ion-searchbar>
  </ion-item>

  <ion-card>
    <ion-card-content>
      <ion-grid>
        <ion-row class="table-header">
          <ion-col size="2">
            <ion-button class="sort-button" fill="clear" size="small" (click)="changeSort('id')">ID</ion-button>
          </ion-col>
          <ion-col size="5">
            <ion-button class="sort-button" fill="clear" size="small" (click)="changeSort('email')">Email</ion-button>
          </ion-col>
          <ion-col size="5">
            <ion-button class="sort-button" fill="clear" size="small" (click)="changeSort('name')">Naam</ion-button>
          </ion-col>
        </ion-row>

        <ion-row *ngFor="let person of filteredPersons" class="table-row">
          <ion-col size="2">{{ person.id }}</ion-col>
          <ion-col size="5">{{ person.email }}</ion-col>
          <ion-col size="5">{{ person.name }}</ion-col>
        </ion-row>

        <ion-row *ngIf="filteredPersons.length === 0" class="empty-row">
          <ion-col size="12">Geen personen gevonden.</ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</section>
